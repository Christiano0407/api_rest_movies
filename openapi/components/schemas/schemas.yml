schemas:
  # =========================================================
  # Schemas / schemes
  # =========================================================
  # ---- Register User ---- #
  UserRegister:
    type: object
    required:
       - username 
       - email 
       - password
    properties:
      username:
        type: string
        minLength: 3
        maxLength: 30
        example: alma_cantu
      email: 
        type: string
        format: email
        example: dev@example.com
      password: 
        type: string
        format: password
        minLength: 8   
        example: "developerStrongPassword01" 

  # ---- User Response: Account User ---- #
  UserResponse:
    type: object
    required:
      - id
      - username 
      - email 
      - role 
      - is_active
      - created_at
    properties:
      id: 
        type: string
        example: 1
      username: 
        type: string
        example: alma_cantu
      email: 
        type: string
        format: email
        example: dev@example.com
      role: 
        type: string
        enum: [Admin, Manager, Editor, Moderator, Premium, User]
        example: User
      is_active:
        type: boolean
        example: true
      created_at:
        type: string
        format: date-time
        example: "2026-07-01T12:00:00Z"

# ---- Token Response Access Healthy ---- #
  TokenScheme:
    type: object
    required: 
      - access_token
      - refresh_token
      - token_type
    properties: 
      access_token:
        type: string
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      refresh_token: 
        type: string
        example: "alJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ7..."
      token_type: 
        type: string
        example: bearer

# --- TMDB Movies: Logic Response / Proxy / Schemes Business --- #
  TMDBMovieResult:
    type: object
    required: 
      - id 
      - title
      - overview
      - vote_overage
      - genre_ids
    properties:
      id:
        type: string
        example: 1
      title: 
        type: string
        example: Star Wars
      overview: 
        type: string
        example: Princess Leia is held hostage by the evil Imperial Forces...
      poster_path: 
        type: string
        nullable: true
        example: /6FfAOFwRtU56mDpOehXZI7Yv3j1.jpg
      backdrop_path: 
        type: string
        nullable: true
        example: /6FfAOFwRtU56mDpOehXZI7Yv3j1.jpg
      release_date: 
        type: string
        format: date
        example: "1977-05-25" 
      vote_overage:
        type: number
        format: float
        example: 8.5
      genre_ids: 
        type: array
        items: 
          type: integer
        example: [12, 28, 878]


  GatewayPaginationResponse: 
    type: object
    required: 
      - page
      - results
      - total_pages
      - total_results
      - from_cache
      - rate_limiting_remaining
    properties:
      page: 
        type: string
        example: 1
      results:
        type: array
        items: 
          $ref: './TMDBMovieResult.yml'
      total_pages:
        type: integer
        example: 500
      total_results:
        type: integer
        example: 1000
      from_cache: 
        type: boolean
        description: Determina si el Gateway resolvió la petición desde Redis en menos de 2 milisegundos
      rate_limiting_remaining: 
        type: integer
        description: 
          Peticiones disponibles que le quedan al usuario para el minuto actual según su rol (RBAC)

  WatchlistPayload:
    type: object
    required: 
      - media_type
      - media_id
      - watchlist
    properties:


  


