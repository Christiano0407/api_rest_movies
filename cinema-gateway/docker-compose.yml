services: 
  postgres: 
    image: postgres:16-alpine
    container_name: cinema_postgres
    restart: unless-stopped
    env_file: 
      - .env
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5436:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: 
      - cinema_net

  redis: 
    image: redis:7-alpine
    container_name: cinema_redis
    restart: unless-stopped
    ports: 
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: 
      - cinema_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: 
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys:ro
    expose: 
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - cinema_net

  nginx: 
    image: nginx:1.27-alpine
    container_name: cinema_nginx
    restart: unless-stopped
    depends_on:
      api: 
        condition: service_healthy
    ports: 
      - "8000:80"
    volumes:
      - ./api-gateway/conf.d/api-gateway.conf.ro
    networks:
      - cinema_net

networks:
  cinema_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

    