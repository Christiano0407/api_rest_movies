paths:
  # =========================================================
  # AUTH & IDENTITY
  # =========================================================
  /auth/register:
    post:
      tags:
        - Identity & Access
      summary: Registro de Usuario (local)
      description: Registrar un nuevo usuario con hash bcrypt
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/UserRegister.yml'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '../components/schemas/UserResponse.yml'
        '422':
          description: Error de validación (Pydantic)

  /auth/login:
    post:
      tags:
        - Identity & Access
      summary: Inicio de Sesión (OAuth2 Password Flow)
      description: Intercambiar credenciales por un par de tokens (Access JWT + Refresh Token)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: alma_cantu
                password:
                  type: string
                  format: password
                  example: "developerStrongPassword01"
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '../components/schemas/TokenScheme.yml'
        "401":
          description: Credenciales Inválidas

  /auth/refresh:
    post:
      tags:
        - Identity & Access
      summary: Rotar Refresh Token
      description: Revoca el refresh token usado y emite un nuevo par de tokens
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Nuevo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: '../components/schemas/TokenScheme.yml'
        "401":
          description: Refresh Token inválido o revocado

  /auth/logout:
    post:
      tags:
        - Identity & Access
      summary: Cerrar Sesión
      description: Revoca el access token actual agregando su jti al blocklist
      operationId: logoutUser
      security:
        - OAuth2PasswordBearer: []
      responses:
        "204":
          description: Sesión cerrada exitosamente
        "401":
          description: Token inválido o expirado

  /auth/tmdb/request-token:
    post:
      tags:
        - Identity & Access
      summary: Solicitar token de autenticación TMDB
      description: Obtiene un request_token de TMDB para iniciar el flujo OAuth
      operationId: createTmdbRequestToken
      security:
        - OAuth2PasswordBearer: []
      responses:
        "200":
          description: Request token creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_token:
                    type: string
                  tmdb_authorize_url:
                    type: string
        "401":
          description: Token inválido

  /auth/tmdb/link:
    post:
      tags:
        - Identity & Access
      summary: Vincular cuenta TMDB
      description: Canjea el request_token aprobado por un session_id y lo persiste
      operationId: linkTmdbAccount
      security:
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_token:
                  type: string
      responses:
        "201":
          description: Cuenta TMDB vinculada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  user_id:
                    type: integer
                  session_id:
                    type: string
                  account_id:
                    type: integer
                    nullable: true
                  connected_at:
                    type: string
                    format: date-time
        "401":
          description: Token inválido

  # =========================================================
  # CINEMA DISCOVERY (Cached & Proxy TMDB)
  # =========================================================
  /cinema/movies/search:
    get:
      tags:
        - Cinema Discovery
      summary: Buscar películas por texto libre
      description: Proxy con caché hacia el endpoint /search/movie de TMDB
      operationId: searchMovies
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: "Star Wars"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Resultados de búsqueda (desde caché o TMDB)
          content:
            application/json:
              schema:
                $ref: '../components/schemas/GatewayPaginationResponse.yml'
        "401":
          description: Token inválido o expirado

  /cinema/movies/{category}:
    get:
      tags:
        - Cinema Discovery
      summary: Obtener listado de películas por Categoría
      description: Mapea dinámicamente los endpoints de listas de TMDB
      operationId: getMoviesByCategory
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - $ref: '../components/parameters/MovieCategoryParam.yml'
        - $ref: '../components/parameters/MoviePageParam.yml'
      responses:
        "200":
          description: Listado obtenido (desde caché o TMDB)
          content:
            application/json:
              schema:
                $ref: '../components/schemas/GatewayPaginationResponse.yml'
        "401":
          description: Token inválido o expirado

  /cinema/movies/{movie_id}/complementary:
    get:
      tags:
        - Cinema Discovery
      summary: Obtener datos complementarios de una película
      description: Ejecuta llamadas concurrentes asíncronas a detalles, créditos y videos de TMDB
      operationId: getMoviesComplementaryData
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - $ref: '../components/parameters/MovieIdParam.yml'
      responses:
        "200":
          description: JSON agregado desde TMDB
          content:
            application/json:
              schema:
                $ref: '../components/schemas/MovieComplementaryData.yml'
        "401":
          description: Token inválido o expirado

  # =========================================================
  # USER ACCOUNT SYNC (TMDB Session Binding)
  # =========================================================
  /account/watchlist:
    post:
      tags:
        - User Account Sync
      summary: Sincronizar watchlist del usuario con TMDB
      description: Extrae la session de TMDB del usuario y ejecuta la mutación
      operationId: updateTMDBWatchlist
      security:
        - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/WatchlistPayload.yml'
      responses:
        "200":
          description: Sincronización exitosa
          content:
            application/json:
              schema:
                $ref: '../components/schemas/WatchlistSyncResult.yml'
        "400":
          description: El usuario no ha vinculado su cuenta TMDB
        "401":
          description: Token JWT inválido o expirado
