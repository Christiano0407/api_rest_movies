[project]
name = "api-rest-movies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "aiocache>=0.12.3",
    "aiokafka>=0.14.0",
    "alembic>=1.13.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.29.0",
    "celery>=5.6.3",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx>=0.27.0",
    "numpy>=2.4.6",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "passlib[argon2,bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib>=0.3.0",
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "scikit-learn>=1.8.0",
    "secure>=2.0.1",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "sse-starlette>=3.4.4",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
 
[tool.ruff]
line-length = 100
target-version = "py312"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
 
[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
