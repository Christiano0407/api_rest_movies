type: object
required:
  - access_token
  - refresh_token
  - token_type
properties:
  access_token:
    type: string
    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  refresh_token:
    type: string
    example: "alJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ7..."
  token_type:
    type: string
    example: bearer
