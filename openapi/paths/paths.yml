paths:
  /auth/register:
    post:
      tags:
        - identity & Access
      summary: Registro de Usuario (local) | User Register
      description: Registrar un nuevo Usuario en la base de datos relacional
        (postgres) aplicando hashing con bcrypt
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/UserRegister.yml'
      responses:
        '201':
          description: Usuario creado exitosamente 
          content:
            application/json:
              schema:
                $ref: '../components/schemas/UserResponse.yml'
        '422':
          description: Error de validación de datos de entrada (Pydantic)

  /auth/login: 
    post: 
      tags:
        - identity & Access
      summary: Inicio de Sesión (o Volver a entrar) local (OAuth2 Password Flow)
      description: Intercambiar credenciales verificadas por un par de 
        Tokens Criptográficos (Access JTW & Refresh Token)
      operationId: loginUser
      requestBody: 
        required: true
        content: 
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username: 
                  type: string
                  example: alma_cantu
                password: 
                  type: string
                  format: password
                  example: "developerStrongPassword01"
      responses:
        "200": 
          description: Autenticación correcta | Authentication Success (AUTH)
          content: 
            application/json:
              schema:
                $ref:'../components/schemas/TokenScheme.yml'
        "401": 
          description:Credenciales Inválidas 

  # =========================================================
  # --- Path TMDB --- #
  # CINEMA CORE & DISCOVERY (Cached & Proxy TMDB)
  # =========================================================
  /cinema/movies/{category}:
    get: 
      tags: 
        - Cinema Discovery (API TMDB)
      summary: Obtener listado de películas por Categoría
      description: | 
        Mapear Dinámicamente los 'endpoints' (Rutas) de listas de TMDB (`now_playing`, `popular`, `top_rated`, `upcoming`).
        ++flujo (Pipeline/Proceso)**: Valida JWT local -> Evalúa cuota en Redis por Rol -> Verificar caché en Redis.
      operationId: getMoviesByCategory
      security: 
        - OAuth2PasswordBearer: []
      parameters: 
        - $ref: '#components/parameters/MovieCategoryParam'
        - $ef: '#/components/parameters/MoviePageParam'
      responses: 
        "200": 
          description: Listado Obtenido (desde Caché o Fetch asíncrono a TMDB)
          headers: 
            X-Cache: 
              schema: 
                type: string
              description: Inyectado desde Gateway(API). Valores Comerciales MIT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPaginationResponse'
        "401":
          description: Token Inválido o Expirado (Vuelve a ejecutar credenciales)
        "429": 
          description: Rate Limit(peticions/queries) de Negocio excedido para el minuto actual según tu Rol.

  /cinema/movies/{movie_id}/complementary:
    get: 
      tags: 
        - Cinema Discovery (API ID - TMDB)
      summary: Obtener (get) y agregar los datos complementarios de una película (movie) por ID
      description: | 
        Ejecutar llamadas concurrentes asíncronas (Call async & Await) no bloqueantes
        (`asyncio.gather`) hacia los endpoints de detalles, créditos y videos de TMDB para reducir la latencia en el Frontend.
      operationId: getMoviesComplementaryData
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - $ref: '/components/parameters/MovieIdParam.yml'
      responses:
        "200": 
          description: JSON agregado con éxito desde TMDB mediante concurrencia (async&Await)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieComplementaryData'
        "401": 
          description: Token Inválido o Expirado (Vuelve a ejecutar credenciales)
        "403": 
          description: No tienes los permisos requeridos (RBAC).
            



  # =========================================================
  # USER SYNC & MUTATIONS (TMDB Session Binding)
  # =========================================================
  /account/watchlist:
    post: 
      tags: 
        - User Account Sync
      summary: Sincronizar & Alterar la Watchlist del Usuario (RBAC) y Data (postgres) en su cuenta real de TMDB
      description: |
        Identificar al usuario por su JWT (Token) local, extraer **SQLAlchemy(ORM)** su 'tmdb_session_id', 
        y ejecuta la mutación de la API externa de TMDB (Agregar info). 
        **Impacta directamente en las métricas de Popularidad y Trending de TMDB diariamente.**
      operationId: updateTMDBWatchlist
      security:
        - OAuth2PasswordBearer: []